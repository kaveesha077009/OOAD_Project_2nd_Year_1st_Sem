<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - AgroShop</title>

    <!-- Fonts & Frameworks -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #15803d; /* Fresh Crop Green */
            --primary-hover: #166534;
            --bg-color: #f0fdf4; /* Light Mint Tint */
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #bbf7d0;
            --focus-ring: rgba(21, 128, 61, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding-bottom: 48px;
        }

        /* Cart Page Wrapper / Container */
        .shop-main {
            padding-top: 36px;
            max-width: 960px;
        }

        .cart-container {
            background: var(--card-bg);
            padding: 36px 32px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(22, 101, 52, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border-color);
        }

        /* Header & Badges */
        .cart-header {
            margin-bottom: 28px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #ADD8E6;
            color: var(--primary-color);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .page-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: #14532d;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .page-sub {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0;
        }

        /* Form elements & inputs rendered dynamically inside #cartBody */
        input[type="number"],
        input[type="text"],
        select {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: #fafdfb;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 8px 12px;
            outline: none;
            transition: all 0.2s ease-in-out;
            font-family: inherit;
        }

        input:focus,
        select:focus {
            border-color: var(--primary-color) !important;
            background-color: #ffffff !important;
            box-shadow: 0 0 0 3px var(--focus-ring) !important;
        }

        /* Primary action buttons & checkout links */
        .btn-primary,
        .btn-submit,
        .btn-checkout {
            background-color: var(--primary-color) !important;
            border-color: var(--primary-color) !important;
            color: #ffffff !important;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 10px 22px;
            border-radius: 20px !important;
            box-shadow: 0 4px 12px rgba(21, 128, 61, 0.25);
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover,
        .btn-submit:hover,
        .btn-checkout:hover {
            background-color: var(--primary-hover) !important;
            border-color: var(--primary-hover) !important;
            transform: translateY(-1px);
        }

        /* Card and Table elements generated by shop.js */
        .card,
        .cart-item-card {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(22, 101, 52, 0.04);
        }

        .table {
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .table th {
            color: #166534;
            font-weight: 700;
            font-size: 0.875rem;
            border-bottom: 2px solid var(--border-color);
        }

        /* Navigation / return link styling */
        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
            margin-top: 24px;
        }

        .back-link:hover {
            color: var(--primary-color);
        }

        /* Subtle loading state text */
        #cartBody .text-muted {
            color: var(--text-muted) !important;
            font-weight: 500;
            padding: 24px 0;
            text-align: center;
        }
    </style>
</head>
<body data-page="cart">

<div th:replace="~{fragments/shop-nav :: nav('cart')}"></div>

<main class="container shop-main">
    <div class="cart-container">
        <!-- Styled Cart Header with Brand Badge -->
        <div class="cart-header">
            <span class="brand-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="8" cy="21" r="1"/>
                    <circle cx="19" cy="21" r="1"/>
                    <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
                </svg>
                AgroShop Cart
            </span>
            <h1 class="page-title">Your cart</h1>
            <p class="page-sub">Change quantities here. You choose how to pay on the next step.</p>
        </div>

        <!-- Dynamic Cart Content Slot -->
        <div id="cartBody" class="row g-4" aria-live="polite">
            <div class="col-12 text-muted">
                <i class="fa-solid fa-spinner fa-spin me-2"></i> Loading your cart...
            </div>
        </div>

        <!-- Matching Return / Back Action Link -->
        <div class="text-center">
            <a th:href="@{/shop}" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
                </svg>
                Continue Shopping
            </a>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
