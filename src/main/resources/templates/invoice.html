<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Shop Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; }
        .invoice-card { max-width: 650px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <div class="invoice-card" th:if="${order != null}">
        <h3 class="fw-bold mb-4">Agro Shop Invoice</h3>

        <div class="mb-3">
            <p class="m-0"><strong>Order ID:</strong> <span th:text="${order.id}">1</span></p>
            <p class="m-0"><strong>Customer ID:</strong> <span th:text="${order.customerId}">101</span></p>
            <p class="m-0"><strong>Status:</strong> <span class="badge bg-success" th:text="${order.status}">COMPLETED</span></p>
        </div>

        <h5 class="fw-bold mt-4 mb-2">Order Items</h5>
        <table class="table table-bordered align-middle">
            <thead class="table-light">
            <tr>
                <th>Product ID</th>
                <th>Qty</th>
                <th>Unit Price (LKR)</th>
                <th>Subtotal (LKR)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.productId}">1</td>
                <td th:text="${item.quantity}">2</td>
                <td th:text="${item.unitPrice}">250.00</td>
                <td th:text="${item.subtotal}">500.00</td>
            </tr>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="4" class="text-center text-muted">No items found for this order.</td>
            </tr>
            </tbody>
        </table>

        <div class="text-end fw-bold fs-5 my-3">
            Total: LKR <span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</span>
        </div>

        <div class="no-print mt-4">
            <button onclick="window.print()" class="btn btn-secondary btn-sm">Print Invoice</button>
            <a href="/orders" class="btn btn-outline-primary btn-sm ms-2">Back to Orders</a>
        </div>
    </div>


    <div class="invoice-card text-center text-danger" th:if="${order == null}">
        <h4>Invalid Order ID or Order Not Found!</h4>
        <a href="/orders" class="btn btn-primary btn-sm mt-3">Go to Orders List</a>
    </div>
</div>

</body>
</html>
