<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<h2>Order History & Management</h2>
<a href="/orders" class="btn btn-primary mb-3">Refresh Orders List</a>

<table class="table table-bordered table-striped">
    <thead class="table-success">
    <tr>
        <th>Order ID</th>
        <th>Customer ID</th>
        <th>Order Date</th>
        <th>Total Amount</th>
        <th>Status</th>
        <th>Action</th>
        <th>Invoice</th>
    </tr>
    </thead>
    <tbody>
    <!-- Loop through orders -->
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}">1</td>
        <td th:text="${order.customerId}">101</td>
        <td th:text="${order.orderDate}">2026-09-26</td>
        <td th:text="${order.totalAmount}">2500.00</td>
        <td th:text="${order.status}">COMPLETED</td>
        <td><button class="btn btn-sm btn-info">View</button></td>
        <td><a th:href="@{'/invoice?id=' + ${order.id}}" class="btn btn-sm btn-success">Invoice</a></td>
    </tr>

    <!-- If list is empty -->
    <tr th:if="${#lists.isEmpty(orders)}">
        <td colspan="7" class="text-center text-danger">No orders found in database!</td>
    </tr>
    </tbody>
</table>

</body>
</html>
