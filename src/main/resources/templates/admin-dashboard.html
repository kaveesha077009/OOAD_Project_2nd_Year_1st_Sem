<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - AgroShop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #15803d; /* Fresh Crop Green */
            --primary-hover: #166534;
            --bg-color: #f0fdf4; /* Light Mint Tint */
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #bbf7d0;
            --focus-ring: rgba(21, 128, 61, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .form-container {
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            padding: 36px 32px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(22, 101, 52, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border-color);
        }

        .header { text-align: center; margin-bottom: 24px; }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #ADD8E6;
            color: var(--primary-color);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 800;
            color: #14532d;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .sub-heading {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .alert-success {
            background-color: #dcfce7;
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .form-group { display: flex; flex-direction: column; }

        .form-group.full-width { grid-column: span 2; }

        label {
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 6px;
            color: #166534;
        }

        /* Password field wrapper */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            background-color: #fafdfb;
            color: var(--text-main);
            transition: all 0.2s ease-in-out;
            font-family: inherit;
        }

        .password-wrapper input {
            padding-right: 42px;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--primary-color);
        }

        .btn-submit {
            grid-column: span 2;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(21, 128, 61, 0.25);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover { color: var(--primary-color); }

        @media (max-width: 500px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width, .btn-submit { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header">
        <span class="brand-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
            AgroShop Admin
        </span>
        <h2>Create Employee Account</h2>
        <p class="sub-heading">නව සේවක ගිණුමක් සාදා තනතුර (Position) පවරන්න.</p>
    </div>

    <div th:if="${param.success}" class="alert-success">
        සේවක ගිණුම සාර්ථකව සාදන ලදී! (Employee Account Created Successfully!)
    </div>

    <form th:action="@{/admin/employees/create}" method="post" class="form-grid">

        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="John" required/>
        </div>

        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Doe" required/>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="johndoe" required/>
        </div>

        <!-- Password Field with Corrected Eye State Logic -->
        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" placeholder="••••••••" required/>
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                    <!-- Eye Off Icon (Shown by default when password is hidden) -->
                    <svg id="eyeOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                        <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                        <line x1="2" y1="2" x2="22" y2="22"/>
                    </svg>
                    <!-- Eye Open Icon (Shown when password is revealed) -->
                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="form-group full-width">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="john.doe@example.com" required/>
        </div>

        <div class="form-group full-width">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" placeholder="0712345678" required/>
        </div>

        <div class="form-group full-width">
            <label for="position">Assigned Position</label>
            <select id="position" name="position" required>
                <option value="" disabled selected>Select position...</option>
                <option value="Manager">Manager</option>
                <option value="Cashier">Cashier</option>
                <option value="Inventory Clerk">Inventory Clerk</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Create Employee Account</button>
    </form>

    <a th:href="@{/admin/dashboard}" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Back to Admin Dashboard
    </a>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');

        if (passwordInput.type === 'password') {
            // Reveal password & show OPEN eye icon
            passwordInput.type = 'text';
            eyeIcon.style.display = 'block';
            eyeOffIcon.style.display = 'none';
        } else {
            // Hide password & show CLOSED/SLASHED eye icon
            passwordInput.type = 'password';
            eyeIcon.style.display = 'none';
            eyeOffIcon.style.display = 'block';
        }
    }
</script>

</body>
</html>
