<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/shop.css" rel="stylesheet">
    <title>Checkout - AgroShop</title>
</head>
<body data-page="checkout">
<div th:replace="~{fragments/shop-nav :: nav('cart')}"></div>

<main class="container shop-main">
    <h1 class="page-title">Checkout</h1>
    <p class="page-sub">Choose how you will pay --> then place your order.</p>
    <div id="checkoutBody" class="row g-4" aria-live="polite">
        <div class="col-12 text-muted">Loading your order...</div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
