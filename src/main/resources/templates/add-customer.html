<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Customer - AgroShop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #15803d; /* Fresh Crop Green */
            --primary-hover: #166534;
            --bg-color: #f0fdf4; /* Light Mint Tint */
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #bbf7d0;
            --focus-ring: rgba(21, 128, 61, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .form-container {
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            padding: 36px 32px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(22, 101, 52, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border-color);
        }

        .header { text-align: center; margin-bottom: 28px; }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #dcfce7;
            color: var(--primary-color);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #14532d;
            letter-spacing: -0.5px;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .form-group { display: flex; flex-direction: column; margin-bottom: 16px; }

        .form-group.full-width { grid-column: span 2; }

        label {
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 6px;
            color: #166534;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            background-color: #fafdfb;
            transition: all 0.2s ease-in-out;
        }

        input:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .btn-submit {
            grid-column: span 2;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(21, 128, 61, 0.25);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover { color: var(--primary-color); }

        @media (max-width: 500px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width, .btn-submit { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header">
        <span class="brand-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
            AgroShop Management
        </span>
        <h2>Register Customer</h2>
    </div>

    <form th:action="@{/customers/save}" th:object="${customer}" method="post" class="form-grid">

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="johndoe" required/>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required/>
        </div>

        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" th:field="*{firstName}" placeholder="John" required/>
        </div>

        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" th:field="*{lastName}" placeholder="Doe" required/>
        </div>

        <div class="form-group full-width">
            <label for="email">Email Address</label>
            <input type="email" id="email" th:field="*{email}" placeholder="john.doe@example.com" required/>
        </div>

        <div class="form-group full-width">
            <label for="phoneNum">Phone Number</label>
            <input type="text" id="phoneNum" th:field="*{phoneNum}" maxlength="10" placeholder="0712345678" required/>
        </div>

        <div class="form-group full-width">
            <label for="address">Address</label>
            <input type="text" id="address" th:field="*{address}" placeholder="123 Main Street, City" required/>
        </div>

        <button type="submit" class="btn-submit">Save Customer</button>
    </form>

    <a th:href="@{/customers}" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Back to Customer List
    </a>
</div>

</body>
</html>
