<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New sale | AgroShop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div id="page-head"></div>
  <section class="panel">
    <h2>Add to bill</h2>
    <div class="grid">
      <div class="wide"><label for="product">Product</label><select id="product"></select></div>
      <div><label for="qty">Quantity</label><input id="qty" type="number" min="0.01" step="0.01" value="1"></div>
    </div>
    <div class="actions"><button id="add">Add to bill</button></div>
  </section>

  <div class="table-wrap panel" style="padding:0">
    <table>
      <thead><tr><th>Product</th><th class="num">Quantity</th><th class="num">Price</th><th class="num">Amount</th><th></th></tr></thead>
      <tbody id="bill"></tbody>
    </table>
  </div>
  <section class="panel" style="max-width:420px">
    <div class="total" style="padding-top:0"><span>Total</span><span id="total">Rs. 0.00</span></div>
    <label for="pay">Payment</label>
    <select id="pay"><option value="CASH">Cash</option><option value="CARD">Card</option></select>
    <div class="actions"><button id="done">Complete sale</button></div>
  </section>
</main>

<script src="js/app.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let products = [], bill = [];

  function render() {
    $('bill').replaceChildren(...(bill.length ? bill.map(l => h('tr', {},
      h('td', {}, l.name), h('td', { class: 'num' }, num(l.qty) + ' ' + l.unit), h('td', { class: 'num' }, money(l.price)),
      h('td', { class: 'num' }, money(l.price * l.qty)),
      h('td', {}, h('button', { class: 'small danger', onclick: () => { bill = bill.filter(x => x !== l); render(); } }, 'Remove'))))
      : [h('tr', {}, h('td', { colspan: 5, class: 'empty' }, 'The bill is empty.'))]));
    $('total').textContent = money(bill.reduce((s, l) => s + l.price * l.qty, 0));
  }

  $('add').addEventListener('click', () => {
    const p = products.find(x => String(x.id) === $('product').value), qty = Number($('qty').value);
    if (!p) return toast('Choose a product', true);
    if (!(qty > 0)) return toast('Enter a quantity above zero', true);
    const line = bill.find(l => l.id === p.id);
    if (line) line.qty += qty; else bill.push({ id: p.id, name: p.name, unit: p.unit, price: p.price, qty });
    $('qty').value = 1; render();
  });

  $('done').addEventListener('click', () => run(async () => {
    if (!bill.length) return toast('Add at least one product', true);
    const o = await api('POST', '/api/orders/sale', { paymentMethod: $('pay').value, items: bill.map(l => ({ productId: l.id, quantity: l.qty })) });
    toast('Sale #' + o.id + ' recorded. Total ' + money(o.total));
    bill = []; render(); await load();
  }));

  async function load() {
    products = await api('GET', '/api/products');
    $('product').replaceChildren(h('option', { value: '' }, 'Choose a product'),
      products.map(p => h('option', { value: p.id }, p.name + ' (' + money(p.price) + ' / ' + p.unit + ', ' + num(p.quantity) + ' in stock)')));
  }

  renderLayout('sale.html', 'New sale', 'Record a sale made at the counter. Stock updates when you complete it.').then(me => { if (me) { render(); run(load); } });
</script>
</body>
</html>
