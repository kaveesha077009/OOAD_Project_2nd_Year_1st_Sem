<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | AgroShop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <h1>AgroShop</h1>
  <p class="sub">Sign in to order supplies or manage the shop.</p>
  <div class="panel">
    <div><label for="u">Username</label><input id="u" autocomplete="username" autofocus></div>
    <div><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"></div>
    <button id="go" style="width:100%">Sign in</button>
    <p style="margin:0;font-size:.9rem"><a href="shop.html">Browse products without signing in</a></p>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/app.js"></script>
<script>
  const go = async () => {
    try {
      const me = await api('POST', '/api/auth/login', { username: document.getElementById('u').value, password: document.getElementById('p').value });
      location.href = me.role === 'CUSTOMER' ? 'shop.html' : me.role === 'ADMIN' ? 'products.html' : 'low-stock.html';
    } catch (e) { toast(e.message, true); }
  };
  document.getElementById('go').addEventListener('click', go);
  document.getElementById('p').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  getMe().then(me => { if (me) location.href = me.role === 'CUSTOMER' ? 'shop.html' : 'products.html'; });
</script>
</body>
</html>
