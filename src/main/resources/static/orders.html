<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders | AgroShop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div id="page-head"></div>
  <div class="table-wrap panel" style="padding:0">
    <table>
      <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th class="num">Total</th><th>Payment</th><th>Status</th><th id="actions-th"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  let me = null;
  const METHODS = { CASH_ON_DELIVERY: 'Cash on delivery', BANK_TRANSFER: 'Bank transfer', CASH: 'Cash', CARD: 'Card' };
  const pill = (text, kind) => h('span', { class: 'pill ' + (kind || '') }, text.charAt(0) + text.slice(1).toLowerCase());
  const statusKind = (s) => ({ DELIVERED: 'good', COMPLETED: 'good', CANCELLED: 'bad', FAILED: 'bad', REFUNDED: 'bad', PENDING: 'warn' }[s] || '');

  async function load() {
    const staff = me.role !== 'CUSTOMER';
    document.getElementById('actions-th').textContent = staff ? 'Actions' : '';
    const list = await api('GET', staff ? '/api/orders' : '/api/orders/my');
    document.getElementById('rows').replaceChildren(...(list.length ? list.map(o => {
      const open = o.status !== 'CANCELLED' && o.status !== 'DELIVERED';
      const act = (label, fn, cls) => h('button', { class: 'small ' + (cls || 'ghost'), onclick: () => run(async () => { await fn(); await load(); }) }, label);
      const status = (s) => () => api('PUT', '/api/orders/' + o.id + '/status?status=' + s);
      return h('tr', {},
        h('td', {}, '#' + o.id, h('div', { class: 'items' }, new Date(o.orderDate).toLocaleString())),
        h('td', {}, o.customerName),
        h('td', { class: 'items' }, o.items.map(i => h('div', {}, num(i.quantity) + ' ' + i.unit + ' ' + i.productName))),
        h('td', { class: 'num' }, money(o.total)),
        h('td', {}, METHODS[o.paymentMethod] || o.paymentMethod, h('div', {}, pill(o.paymentStatus, statusKind(o.paymentStatus)))),
        h('td', {}, pill(o.status, statusKind(o.status))),
        h('td', {}, staff && open ? h('div', { class: 'row-actions' },
          o.paymentStatus === 'PENDING' && o.paymentMethod === 'BANK_TRANSFER' ? act('Confirm payment', () => api('PUT', '/api/orders/' + o.id + '/payment/confirm'), '') : null,
          o.status === 'PENDING' ? act('Processing', status('PROCESSING')) : null,
          o.status === 'PROCESSING' ? act('Shipped', status('SHIPPED')) : null,
          o.status === 'SHIPPED' ? act('Delivered', status('DELIVERED')) : null,
          h('button', { class: 'small danger', onclick: () => { if (confirm('Cancel order #' + o.id + '? Stock is returned.')) run(async () => { await status('CANCELLED')(); await load(); }); } }, 'Cancel')) : null));
    }) : [h('tr', {}, h('td', { colspan: 7, class: 'empty' }, 'No orders yet.'))]));
  }

  renderLayout('orders.html', 'Orders', 'Track orders and payments.').then(u => {
    me = u; if (!me) return;
    if (me.role === 'CUSTOMER') document.querySelector('h1').textContent = 'My orders';
    run(load);
  });
</script>
</body>
</html>
