<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Low stock | AgroShop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div id="page-head"></div>
  <div class="table-wrap panel" style="padding:0">
    <table>
      <thead><tr><th>Product</th><th>Category</th><th class="num">In stock</th><th class="num">Alert level</th><th>Restock</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  renderLayout('low-stock.html', 'Low stock', 'These products are at or below their alert level. Order more from your suppliers.');

  async function load() {
    const list = await api('GET', '/api/products/low-stock');
    document.getElementById('rows').replaceChildren(...(list.length ? list.map(p => {
      const amount = h('input', { type: 'number', min: '0.01', step: '0.01', value: '10', 'aria-label': 'Amount received for ' + p.name, style: 'width:90px' });
      return h('tr', { class: p.quantity <= 0 ? 'low' : '' },
        h('td', {}, h('strong', {}, p.name)),
        h('td', {}, p.categoryName),
        h('td', { class: 'num' }, num(p.quantity) + ' ' + p.unit),
        h('td', { class: 'num' }, num(p.minimumStock) + ' ' + p.unit),
        h('td', {}, h('div', { class: 'row-actions' }, amount,
          h('button', { class: 'small', onclick: () => run(async () => {
            await api('PUT', '/api/products/' + p.id + '/stock?quantityChange=' + encodeURIComponent(amount.value));
            toast('Stock updated'); await load();
          }) }, 'Add stock'))));
    }) : [h('tr', {}, h('td', { colspan: 5, class: 'empty' }, 'Every product is above its alert level.'))]));
  }

  run(load);
</script>
</body>
</html>
